<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M Studio coaching</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="M Studio">
<meta name="theme-color" content="#0E6B66">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#13201F; --muted:#5C6B69; --line:#D6DEDC;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --soft:#DCEBE9; --warn:#B4434A; --warn-soft:#F5DADB; --ok:#2E7D4F; --ok-soft:#DCEFE2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1615; --surface:#172221; --ink:#E6EEEC; --muted:#93A4A1; --line:#2A3836;
  --accent:#3DB3AB; --accent-ink:#06201E; --soft:#1C3532; --warn:#E07A80; --warn-soft:#3B2022; --ok:#5CC285; --ok-soft:#173023; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
:root{padding-top:env(safe-area-inset-top,0px)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.grow{flex:1;min-width:0}
main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:18px;padding-block:6px 20px}
h2.sec{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--soft);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row.tap{width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
.notice{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.mute{background:var(--line);color:var(--muted)}
.hello{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0;text-wrap:balance}
.hello span{color:var(--accent)}
.wk-tabs{display:flex;flex-wrap:wrap;gap:6px}
.wk{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.wk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.seance{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.seance-h{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
.seance-h h3{margin:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;flex:1;min-width:0}
.exo{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line)}
.exo .n{font-family:var(--display);font-weight:800;font-size:30px;color:var(--accent);line-height:1;grid-row:span 3}
.exo .nm{font-weight:700;font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-variant-numeric:tabular-nums}
.pill.main{background:var(--accent);color:var(--accent-ink)}
.exo .note{font-size:13px;color:var(--muted)}
.ech{margin:4px 14px 12px;padding:12px 14px;border-radius:12px;background:var(--soft);border-left:4px solid var(--accent);white-space:pre-wrap;font-size:14px}
.ech-k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.seance-f{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.done-banner{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.v.down{color:var(--ok)} .v.up{color:var(--warn)}
.chart{padding:10px 8px 6px}
.chart svg{width:100%;height:auto;display:block}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gallery button{border:0;padding:0;background:none;border-radius:10px;overflow:hidden;aspect-ratio:3/4;max-width:100%;position:relative}
.gallery img,.cmp img{width:100%;height:100%;object-fit:cover;display:block;background:var(--line)}
.gallery span{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px}
.cmp .ph{aspect-ratio:3/4;border-radius:12px;overflow:hidden;max-width:100%}
.cmp figcaption{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0;font-size:16px}
.f textarea{min-height:80px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form{display:flex;flex-direction:column;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:130px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:800;font-family:var(--display);font-size:20px}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
nav.tabs button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,16,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h3{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:22px}
.sheet-body{padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:90%;text-align:center}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:40px}
.login .logo{font-family:var(--display);font-weight:800;font-size:54px;line-height:.95;text-transform:uppercase}
.login .logo span{color:var(--accent);display:block}
.seg{overflow-x:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{white-space:nowrap;min-width:max-content;flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:3px;border-radius:8px;background:var(--warn);color:#fff;font-size:10px;line-height:16px;font-weight:800}
.alert{border-color:var(--accent);background:var(--soft)}
.alert-w{border-color:var(--warn);background:var(--warn-soft)}
.tap-panel{width:100%;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.alert .bar{background:var(--surface)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;padding:14px;margin:0;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:10px 12px;border-radius:16px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub time{display:block;font-size:11px;opacity:.7;margin-top:4px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-block:8px}
.composer textarea{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;resize:none}
.timer{position:sticky;top:58px;z-index:3;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.timer .k{color:var(--accent-ink);opacity:.8}.timer .bar{background:rgba(255,255,255,.25)}.timer .bar i{background:var(--accent-ink)}
.timer .btn{background:rgba(255,255,255,.18);color:var(--accent-ink)}.timer .btn.ghost{border-color:rgba(255,255,255,.4)}
.tm{font-family:var(--display);font-weight:800;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.set{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;min-width:74px}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.n2{font-family:var(--display);font-weight:800;font-size:26px;color:var(--accent);line-height:1}
.demo{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap;padding:3px 8px;border-radius:999px;background:var(--soft)}
.last{font-size:12px;font-weight:700;color:var(--accent);margin-top:3px}
.setrows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sh,.sr{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 64px;gap:6px;align-items:center}
.sh span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.sr input{width:100%;min-width:0;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;text-align:center;font-variant-numeric:tabular-nums}
.sr .sn{font-family:var(--display);font-weight:800;font-size:20px;text-align:center;color:var(--muted)}
.sr.on input{background:var(--ok-soft);border-color:var(--ok)}
.sr .set{min-width:0;padding:9px 0}
.perf summary{list-style:none;cursor:pointer}.perf summary::-webkit-details-marker{display:none}
.perf[open] summary{border-bottom:0}
.macro{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0 10px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mgrid div{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.mgrid b{font-size:18px}.dot{width:10px;height:10px;border-radius:50%}
.pl{display:flex;height:54px;border-radius:27px;overflow:hidden;font-size:12px;font-weight:700;color:#fff}
.pl div{display:flex;align-items:center;justify-content:center;text-align:center}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.s5{grid-template-columns:repeat(5,minmax(0,1fr))}
.scl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pill.bad{background:var(--warn-soft);color:var(--warn)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;border:1px dashed var(--line);text-align:center;opacity:.45;filter:grayscale(1)}
.bdg.ok{opacity:1;filter:none;border-style:solid;background:var(--surface)}
.bdg span{font-size:28px}.bdg small{font-size:11px;font-weight:600;line-height:1.25}
.dt summary{cursor:pointer;color:var(--accent);font-weight:600}
.err{color:var(--warn);font-size:14px;font-weight:600}
.avatar{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;background:var(--soft);color:var(--accent)}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:15px}
.code{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.08em;user-select:all;-webkit-user-select:all}
details.cons{background:var(--soft);border-radius:14px;padding:12px 14px}
details.cons summary{font-weight:700;cursor:pointer}
.big-img{width:100%;border-radius:12px;display:block}
@media (min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top" id="hdr" hidden><div class="wrap"><div class="grow"><div class="brand">M Studio<small id="sub">COACHING</small></div></div><span id="hdrRight"></span></div></header>
<main><div class="wrap" id="view"><div class="empty">Chargement…</div></div></main>
<nav class="tabs" id="nav" hidden><div class="wrap" id="tabs"></div></nav>
<div id="sheetRoot"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
var CFG=window.MSTUDIO||{}, sb=null, me=null, prof=null, tab=null;
var D={prog:null,done:[],mesures:[],photos:[]};      // client data
var C={clients:[],invs:[],sel:null,selTab:"prog",act:null}; // coach data
var weekSel=null, urlCache={};
var $=function(id){return document.getElementById(id)};

/* ---------- utils ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ymd(d){d=d||new Date();var m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(j<10?"0":"")+j}
function pd(s){var p=String(s||"").slice(0,10).split("-");return new Date(+p[0],(+p[1]||1)-1,+p[2]||1)}
var MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fdate(s){if(!s)return"";var d=new Date(s);if(String(s).length<=10)d=pd(s);return d.getDate()+" "+MOIS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")}
function fnum(n){return n==null||n===""?"–":(+n).toLocaleString("fr-FR",{maximumFractionDigits:1})}
function initials(n){return (n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join("").toUpperCase()}
var tt;function toast(m){var o=document.querySelector(".toast");if(o)o.remove();var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(function(){d.remove()},2800)}
function copy(t){try{navigator.clipboard.writeText(t).then(function(){toast("Copié")},function(){toast("Copie impossible : sélectionne le texte")})}catch(e){toast("Copie impossible : sélectionne le texte")}}
function first(n){return (n||"").split(" ")[0]}
function err(e){console.error(e);toast((e&&e.message)?"Erreur : "+e.message:"Une erreur est survenue, réessaie.")}
function notify(title,msg,tags){
  if(!CFG.NTFY_TOPIC)return;
  try{fetch("https://ntfy.sh/",{method:"POST",body:JSON.stringify({topic:CFG.NTFY_TOPIC,title:title,message:msg,tags:tags||[]})}).catch(function(){})}catch(e){}
}
function weeksOf(p){return (p&&Array.isArray(p.weeks))?p.weeks:[]}
function curWeek(p){var n=weeksOf(p).length;if(!n)return 0;var d=Math.floor((pd(ymd())-pd(p.debut))/864e5/7);return Math.max(0,Math.min(n-1,d))}

/* ---------- sheet ---------- */
function openSheet(title,body,mount){
  var r=$("sheetRoot");
  r.innerHTML='<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet-head"><h3>'+esc(title)+'</h3><button class="btn sm ghost" data-close="1">Fermer</button></div><div class="sheet-body">'+body+'</div></div></div>';
  r.querySelector(".scrim").addEventListener("click",function(e){if(e.target.dataset.close)closeSheet()});

var MKEYS=[["poids","Poids","kg"],["taille","Tour de taille","cm"],["hanches","Hanches","cm"],["poitrine","Poitrine","cm"],["cuisse","Cuisse","cm"],["bras","Bras","cm"]];
function chartSvg(rows){
  var pts=rows.filter(function(r){return r.poids!=null&&r.poids!==""}).map(function(r){return {d:pd(r.date).getTime(),v:+r.poids,s:r.date}});
  if(pts.length<2)return '<div class="empty">La courbe de poids apparaît dès la 2ᵉ pesée.</div>';
  var W=340,H=150,L=34,R=12,T=14,B=26,minV=Math.min.apply(null,pts.map(function(p){return p.v})),maxV=Math.max.apply(null,pts.map(function(p){return p.v}));
  var pad=Math.max(1,(maxV-minV)*.15);minV=Math.floor(minV-pad);maxV=Math.ceil(maxV+pad);
  var d0=pts[0].d,d1=pts[pts.length-1].d||d0+1;if(d1===d0)d1=d0+1;
  var x=function(d){return L+(d-d0)/(d1-d0)*(W-L-R)},y=function(v){return T+(maxV-v)/(maxV-minV)*(H-T-B)};
  var line=pts.map(function(p){return x(p.d).toFixed(1)+","+y(p.v).toFixed(1)}).join(" ");
  var area="M"+x(pts[0].d)+","+(H-B)+" L"+line.split(" ").join(" L")+" L"+x(pts[pts.length-1].d)+","+(H-B)+" Z";
  var mid=Math.round((minV+maxV)/2),last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution du poids"><g style="font:600 10px var(--body);fill:var(--muted)">'+
    [maxV,mid,minV].map(function(v){return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>'}).join("")+
    '<text x="'+L+'" y="'+(H-8)+'">'+fdate(pts[0].s)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+fdate(last.s)+'</text></g>'+
    '<path d="'+area+'" style="fill:var(--soft)"/><polyline points="'+line+'" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+x(last.d)+'" cy="'+y(last.v)+'" r="5" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/></svg>';
}
function suiviHtml(rows,canAdd){
  var w=rows.filter(function(r){return r.poids!=null&&r.poids!==""});
  var last=w[w.length-1],firstW=w[0],delta=last&&firstW?(+last.poids-+firstW.poids):null;
  var lt=rows.filter(function(r){return r.taille}),dT=lt.length>1?(+lt[lt.length-1].taille-+lt[0].taille):null;
  var html='<div class="stats"><div class="stat"><div class="k">Poids actuel</div><div class="v">'+(last?fnum(last.poids)+' kg':'–')+'</div></div>'+
    '<div class="stat"><div class="k">Depuis le début</div><div class="v '+(delta<0?'down':delta>0?'up':'')+'">'+(delta==null?'–':(delta>0?'+':'')+fnum(delta)+' kg')+'</div></div>'+
    '<div class="stat"><div class="k">Tour de taille</div><div class="v">'+(lt.length?fnum(lt[lt.length-1].taille)+' cm':'–')+'</div></div>'+
    '<div class="stat"><div class="k">Taille gagnée</div><div class="v '+(dT<0?'down':dT>0?'up':'')+'">'+(dT==null?'–':(dT>0?'+':'')+fnum(dT)+' cm')+'</div></div></div>';
  if(canAdd)html+='<button class="btn primary block" id="addM">+ Nouvelle pesée et mensurations</button>';
  html+='<section><h2 class="sec">Poids</h2><div class="panel chart">'+chartSvg(rows)+'</div></section>';
  html+='<section><h2 class="sec">Historique</h2><div class="panel">'+(rows.length?'<div class="tbl"><table><thead><tr><th>Date</th>'+MKEYS.map(function(k){return '<th>'+k[1].replace("Tour de taille","Taille")+' ('+k[2]+')</th>'}).join("")+'<th></th></tr></thead><tbody>'+rows.slice().reverse().map(function(r){return '<tr><td>'+fdate(r.date)+'</td>'+MKEYS.map(function(k){return '<td>'+fnum(r[k[0]])+'</td>'}).join("")+'<td><button class="btn sm ghost" data-delm="'+r.id+'" aria-label="Supprimer">✕</button></td></tr>'+(r.note?'<tr><td colspan="8" class="notice" style="text-align:left;white-space:normal">'+esc(r.note)+'</td></tr>':'')}).join("")+'</tbody></table></div>':'<div class="empty">Aucune mesure pour l\'instant.</div>')+'</div></section>';
  return html;
}

function streak(){var p=D.prog;if(!p)return 0;var ws=weeksOf(p),cw=curWeek(p),n=0;
  function full(i){var ss=(ws[i]&&ws[i].seances)||[];return ss.length&&ss.every(function(s,j){return doneFor(i,j)})}
  var i=full(cw)?cw:cw-1;while(i>=0&&full(i)){n++;i--}return n}

  return ex;

/* ---------- mode séance (chrono) ---------- */
var SES=null,tmInt=null,actx=null,wake=null;
function parseRest(t){t=String(t||"").toLowerCase().replace(",",".");
  var q=t.match(/(\d+)\s*'\s*(\d+)?/);if(q)return (+q[1])*60+(q[2]?+q[2]:0);
  var m=t.match(/(\d+(?:\.\d+)?)\s*(?:min|mn|m)\b\s*(\d+)?/);if(m)return Math.round(parseFloat(m[1])*60+(m[2]?+m[2]:0));
  var s=t.match(/(\d+)\s*(?:s|sec)/);if(s)return +s[1];var n=parseInt(t,10);return isNaN(n)?0:n}
function nSets(x){var n=parseInt(x.series,10);return isNaN(n)||n<1?1:Math.min(n,12)}
function beep(){try{if(!actx)return;[0,0.3,0.6].forEach(function(d){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.25,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d+0.22);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+0.25)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}}
function stopTimer(){if(tmInt){clearInterval(tmInt);tmInt=null}var b=$("tmBox");if(b)b.hidden=true}
function startTimer(sec){stopTimer();if(!sec)return;var end=Date.now()+sec*1000,b=$("tmBox");if(!b)return;b.hidden=false;
  function tick(){var r=Math.max(0,Math.round((end-Date.now())/1000));var el=$("tmVal");if(!el){stopTimer();return}el.textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0");$("tmBar").style.width=(100-r/sec*100)+"%";if(r<=0){stopTimer();beep();toast("C'est reparti 💪")}}
  tick();tmInt=setInterval(tick,250);
  $("tmPlus").onclick=function(){end+=15000;sec+=15};$("tmSkip").onclick=function(){stopTimer()};}
document.addEventListener("click",function(e){var t=e.target.closest("[data-start]");if(!t||!prof||prof.role==="coach")return;startSession(+t.dataset.start)});

  else{h+='<button class="btn primary block" data-goc="checkin">+ Faire mon bilan de la semaine</button>'+checksHtml(D.checks)}
  return h}
document.addEventListener("click",function(e){var t=e.target.closest("[data-sv]");if(!t)return;D.sv=t.dataset.sv;render()});

boot();
})();
</script>
</body>
